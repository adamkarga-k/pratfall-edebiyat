---
deployment:
  tasks:
    # Hedef yayın klasörü: pratfall.com.tr ana dizini
    - export DEPLOYPATH=/home/$USER/pratfall
    
    # 1. Veri ve Medya Klasörlerini Güvenceye Al (İzinler)
    - /bin/mkdir -p $DEPLOYPATH/data
    - /bin/mkdir -p $DEPLOYPATH/uploads/docx-images
    - /bin/chmod 755 $DEPLOYPATH/data
    - /bin/chmod 755 $DEPLOYPATH/uploads
    
    # 2. Güvenlik Dosyalarını ve İzinleri Belirle
    - /bin/chmod 644 $DEPLOYPATH/.htaccess 2>/dev/null || true
    - /bin/chmod 644 $DEPLOYPATH/data/.htaccess 2>/dev/null || true
    - /bin/chmod 644 $DEPLOYPATH/uploads/.htaccess 2>/dev/null || true
